# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket says 6-8 days, DB says 2: trust the DB
stale_policy: FM-06            # SHIP-LATE-OLD (superseded) / SHIP-LATE-FUTURE (not yet effective)
clause_sum: FM-04              # add SHIP-LATE-03 + DMG-04 instead of taking the larger one
double_deduct: FM-05           # deduct the prior refund, then the host deducts it again
sibling_refund: FM-07          # "gom don": money lands under another claim of the same order
denied_ignored: FM-02          # expired approval / order already refunded, still report resolved
reply_ledger_mismatch: FM-08   # reply promises 35.000 while the approval caps the ledger at 20.000
cross_principal: FM-09         # P-200/P-300 asks for P-100's order, or asks for PII
